name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU development tools and tiny-model test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,test-ml]'
      - name: Lint
        run: python -m ruff check src tests tools
      - name: Test without network access or model weights
        run: python -m pytest -q
      - name: Exercise the synthetic demo and measured-result checks
        run: |
          qwen-posttrain demo --task examples/arithmetic/task.json --output runs/ci-demo.jsonl
          qwen-posttrain verify-results --summary results/benchmark.json --curve results/grpo_reward_curve.csv
      - name: Build source and wheel distributions
        run: python -m build
