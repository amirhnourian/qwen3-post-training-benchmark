[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-post-training-benchmark"
version = "0.1.0"
description = "Verified agent rollouts, rejection-sampling fine-tuning and online GRPO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "LicenseRef-All-Rights-Reserved"
license-files = ["LICENSE"]
authors = [{ name = "Amirhossein" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.2", "build==1.3.0"]
test-ml = ["torch==2.7.1", "transformers==4.57.6", "numpy==2.5.4"]
report = ["matplotlib==3.11.2", "pypdf==6.21.2"]
gpu = [
  "torch==2.7.1",
  "transformers==4.57.6",
  "peft==0.18.1",
  "accelerate==1.12.0",
  "bitsandbytes==0.49.2",
  "safetensors==0.8.0",
  "huggingface-hub==0.36.2",
  "numpy==2.5.4",
]

[project.scripts]
qwen-posttrain = "qwen_posttrain.cli:main"

[project.urls]
Repository = "https://github.com/amirhnourian/qwen3-post-training-benchmark"
Documentation = "https://github.com/amirhnourian/qwen3-post-training-benchmark/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qwen_posttrain = ["demo_task.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: requires the explicitly installed optional GPU stack"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
